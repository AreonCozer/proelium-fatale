<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Cutscene Oynat</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #17181a;
      font-family: system-ui, sans-serif;
    }
    button {
      padding: 14px 20px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #f2e6d8;
      background: linear-gradient(180deg, #9a1f1f, #6e1414);
      border: 1px solid #3a0b0b;
      border-radius: 10px;
      cursor: pointer;
      width: 90%;
      transition: transform 0.1s ease, filter 0.15s ease;
    }
    button:hover { filter: brightness(1.12); }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.5; cursor: default; }
    p {
      position: absolute;
      bottom: 6px;
      font-size: 11px;
      color: #7a7a7a;
      font-family: system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <button id="play">⚔️ Proelium Fatale</button>

  <script type="module">
    import OBR from "https://esm.sh/@owlbear-rodeo/sdk@2";

    const CHANNEL = "com.proeliumfatale.cutscene/play";
    const btn = document.getElementById("play");

    btn.addEventListener("click", async () => {
      btn.disabled = true;
      btn.textContent = "Oynatiliyor...";

      // "ALL": hem digerlerine hem de tikleyen GM'e (kendisine) gider,
      // boylece GM de sahnenin geri kalaniyla ayni anda videoyu gorur.
      await OBR.broadcast.sendMessage(CHANNEL, {}, { destination: "ALL" });

      setTimeout(() => {
        btn.disabled = false;
        btn.textContent = "⚔️ Proelium Fatale";
      }, 1500);
    });
  </script>
</body>
</html>
